name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Fuzz smoke
        run: |
          go test -run=^$ -fuzz=^FuzzParse$ -fuzztime=20s ./packet/
          go test -run=^$ -fuzz=^FuzzHandleQuery$ -fuzztime=20s ./dnsproxy/
      - name: Demo
        run: go run ./cmd/tun-harness demo -pace 0

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...

  mobile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
      - run: make ios
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;26.1.10909125"
      - run: ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125 make android
